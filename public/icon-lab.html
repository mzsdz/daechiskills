<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아이콘 한 번에 · 대치스킬스</title><meta name="description" content="글자, 폰트, 색상만 바꿔 보고 마음에 드는 아이콘을 PNG로 저장하세요."><link rel="icon" href="/favicon-v6.svg"><meta property="og:type" content="website"><meta property="og:title" content="아이콘 한 번에 · 대치스킬스"><meta property="og:description" content="글자·폰트·색상을 바로 바꿔 보고 PNG로 저장하는 작은 도구."><meta property="og:url" content="https://daechiskills.vercel.app/icon-lab.html"><meta property="og:image" content="https://daechiskills.vercel.app/og/daechiskills-share-v1.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:type" content="image/jpeg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://daechiskills.vercel.app/og/daechiskills-share-v1.jpg"><link rel="stylesheet" href="/icon-lab/style-v1.css"><script src="/icon-lab/app-v1.js" defer></script><script defer src="/_vercel/insights/script.js"></script></head><body><header><a href="/">DAECHI<span>/</span>SKILLS</a><span class="small">작은 도구</span></header><main><div class="intro"><h1>아이콘 한 번에.</h1><p>바꾸고, 보고, 마음에 들면 저장.</p></div><div class="workspace"><section class="preview" aria-label="아이콘 미리보기"><canvas id="preview" width="512" height="512" role="img" aria-label="대치 스킬스 아이콘 미리보기"></canvas><div class="miniatures"><canvas id="small" width="32" height="32" aria-label="작은 탭 크기"></canvas><span>작게 보면 이렇게</span></div><p id="status" role="status" aria-live="polite">글꼴을 준비하고 있어요…</p><div class="actions"><button id="save" class="primary" disabled>PNG 저장 ↓</button><button id="share" hidden>이미지 공유</button></div><p class="privacy">입력한 글자는 서버로 보내지 않아요.</p></section><form id="controls"><fieldset><legend>글자</legend><div class="lines"><label>첫 줄<input id="line1" value="대치" maxlength="12" autocomplete="off"></label><label>둘째 줄<input id="line2" value="스킬스" maxlength="12" autocomplete="off"></label></div><label class="accent-label">색을 바꿀 글자<input id="accentText" value="킬" maxlength="12" autocomplete="off"></label></fieldset><fieldset><legend>폰트</legend><div class="font-options" role="group" aria-label="폰트 선택"><button type="button" data-font="pretendard" aria-pressed="false">1 프리텐다드</button><button type="button" data-font="noto" aria-pressed="true">2 본고딕 Black</button><button type="button" data-font="dohyeon" aria-pressed="false">3 도현</button><button type="button" data-font="jua" aria-pressed="false">4 주아</button></div></fieldset><fieldset><legend>색상</legend><div class="swatches" role="group" aria-label="강조색"><button type="button" data-color="#ff85d5" aria-label="형광 연핑크" style="--swatch:#ff85d5"></button><button type="button" data-color="#c92032" aria-label="핏빛 빨강" style="--swatch:#c92032"></button><button type="button" data-color="#5364ff" aria-label="형광 군청" style="--swatch:#5364ff"></button><button type="button" data-color="#f2a1c6" aria-label="형광 녹색" style="--swatch:#f2a1c6"></button><button type="button" data-color="#ff9d42" aria-label="밝은 주황" style="--swatch:#ff9d42"></button><button type="button" data-color="#f5f4ef" aria-label="크림색" style="--swatch:#f5f4ef"></button></div><div class="colors"><label>강조색<input id="accent" type="color" value="#ff85d5"></label><label>글자색<input id="ink" type="color" value="#f5f4ef"></label><label>배경색<input id="background" type="color" value="#151711"></label></div></fieldset><details><summary>크기·간격 조절</summary><label class="slider">글자 크기 <output id="sizeValue">128</output><input id="size" type="range" min="40" max="180" value="128"></label><label class="slider">줄 간격 <output id="gapValue">168</output><input id="gap" type="range" min="80" max="240" value="168"></label><label class="slider">모서리 <output id="radiusValue">110</output><input id="radius" type="range" min="0" max="256" value="110"></label></details><button type="button" id="reset" class="reset">처음으로</button></form></div></main><footer>512 × 512 PNG · 가입 없이 바로 사용 <a href="/icon-lab/fonts/noto-LICENSE.txt">폰트 라이선스</a></footer></body></html>
