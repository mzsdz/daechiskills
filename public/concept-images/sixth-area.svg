<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">삼차 원시함수의 두 극값 차이와 2:1 비율</title>
  <desc id="desc">왼쪽 극점 α에서 그은 수평 접선이 오른쪽 γ에서 다시 삼차함수와 만납니다. α에서 오른쪽 극점 β까지의 가로 거리는 d, β에서 γ까지는 d의 절반입니다. 초록색 세로선은 두 극값의 차이입니다.</desc>
  <path fill="#f5f6f1" d="M0 0h720v360H0z"/>
  <path d="M72 86H650" stroke="#657779" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M72 99.97C250.67 2.6 429.33 461.37 608 29.24" stroke="#203e45" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M430 86v132m-7-132h14m-14 132h14" stroke="#17655c" stroke-width="4" fill="none"/>
  <text x="408" y="158" fill="#17655c" font-size="24" font-family="system-ui,sans-serif" text-anchor="end">극값 차이</text>
  <path d="M126 95V251 M430 226v25 M582 95V251" stroke="#607777" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <g fill="#203e45">
    <circle cx="126" cy="86" r="6"/>
    <circle cx="430" cy="218" r="6"/>
    <circle cx="582" cy="86" r="6"/>
  </g>
  <path d="M126 290H582 M126 283v14 M430 283v14 M582 283v14" stroke="#607777" stroke-width="2" fill="none"/>
  <g fill="#203e45" font-family="Georgia,serif" font-style="italic" font-size="29" text-anchor="middle">
    <text x="126" y="271">α</text><text x="430" y="271">β</text><text x="582" y="271">γ</text>
    <text x="278" y="328">d</text><text x="506" y="328">d/2</text>
  </g>
</svg>
