  <desc id="desc">두 교점 α, β 사이에서 x를 잡고 세로 높이와 양쪽 교점까지의 가로 거리를 표시한 그림.</desc>
  <path fill="#f5f6f1" d="M0 0h720v360H0z"/>
  <path d="M124 224 Q360 -72 596 164Z" fill="#cde4df"/>
