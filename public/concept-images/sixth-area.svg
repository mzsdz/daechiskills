  <path d="M124 224 Q360 -72 596 164" stroke="#203e45" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M360 61V194" stroke="#17655c" stroke-width="6" stroke-linecap="round"/>
  <path d="M124 232v25 M360 202v55 M596 172v85" stroke="#607777" stroke-width="2" stroke-dasharray="4 5"/>
  <g fill="#203e45">
    <circle cx="124" cy="224" r="6"/>
    <circle cx="596" cy="164" r="6"/>
  </g>
